<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chai aur Code | HTML </title>
</head>
<body style="background-color: #212121;color:#fff">
    <ul class="language">
        <li>Javascript</li>
    </ul>
</body>
<script>
    function addlan(lang){
        const li=document.createElement('li');
        li.innerHTML=`${lang}`;
        document.querySelector(".language").appendChild(li);
    }
    addlan("Python");
    addlan("TypeScript");

    // More optimised approach , bcoz 
    // due to innerHTML we have to whole
    // traverse tree 
    function optiaddlan(lang){
        const li=document.createElement('li');
        li.appendChild(document.createTextNode(lang));
        document.querySelector(".language").appendChild(li);
    }
    optiaddlan("golang");
    

    // Edit 
    const secondlan=document.querySelector("li:nth-child(2)");
    // secondlan.innerHTML="CSS"; 
    const newli=document.createElement('li');
    newli.textContent="Mojo";
    secondlan.replaceWith(newli);

    //Edit
    const newi=document.querySelector("li:nth-child(1)");
    newi.outerHTML="<li>Ruby</li>"

    // Remove
    const elemen=document.querySelector("li:nth-child(4)");
    elemen.remove();
</script>
</html>
